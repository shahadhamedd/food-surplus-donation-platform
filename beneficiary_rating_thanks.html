<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f7ff;
      --text:#171826;
      --muted:#6a6f86;
      --violet:#6d5efc;
      --violet2:#9b7bff;
      --mint:#26c281;
      --card:rgba(255,255,255,0.86);
      --stroke:rgba(109,94,252,0.14);
      --shadow:0 18px 45px rgba(31, 25, 80, 0.12);
      --r:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Poppins, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 520px at 10% 10%, rgba(109,94,252,0.16), transparent 60%),
        radial-gradient(900px 520px at 85% 20%, rgba(38,194,129,0.12), transparent 60%),
        radial-gradient(900px 520px at 55% 90%, rgba(255,179,71,0.12), transparent 60%),
        var(--bg);
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:18px;
    }
    .card{
      width:min(560px, 96vw);
      border-radius: var(--r);
      background: var(--card);
      border:1px solid var(--stroke);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .top{
      padding:18px 18px 12px;
      background: linear-gradient(135deg, rgba(109,94,252,0.14), rgba(255,255,255,0.80));
      border-bottom:1px solid rgba(109,94,252,0.12);
      display:flex;
      align-items:center;
      gap:12px;
    }
    .ic{
      width:54px;height:54px;border-radius:20px;
      display:grid;place-items:center;
      background: rgba(38,194,129,0.14);
      border:1px solid rgba(38,194,129,0.22);
      font-size:22px;
      flex:0 0 auto;
    }
    h1{margin:0;font-size:18px;font-weight:900}
    p{margin:6px 0 0;color:var(--muted);font-weight:700;font-size:13px}
    .body{padding:18px}
    .msg{
      margin:0;
      font-weight:800;
      line-height:1.6;
    }
    .small{
      margin:10px 0 0;
      color:var(--muted);
      font-weight:800;
      font-size:12.5px;
    }
    .btns{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      padding:12px 14px;
      border-radius: 16px;
      border:1px solid rgba(109,94,252,0.14);
      background: rgba(255,255,255,0.92);
      font-weight:900;
      text-decoration:none;
      color:var(--text);
      cursor:pointer;
      transition: transform .18s ease, filter .18s ease;
    }
    .btn:hover{transform: translateY(-2px); filter:brightness(1.03);}
    .btn-primary{
      border:none;
      color:#fff;
      background: linear-gradient(180deg, var(--violet2), var(--violet));
      box-shadow: 0 18px 35px rgba(109,94,252,0.18);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="top">
      <div class="ic">✅</div>
      <div>
        <h1>Thank you{{ (", " ~ user.full_name) if user and user.full_name else "" }}!</h1>
        <p>Your rating has been submitted successfully.</p>
      </div>
    </div>

    <div class="body">
      <p class="msg">
        We appreciate your feedback. It helps us improve the service.
      </p>

      <p class="small">
        You can return to your requests or go back to the dashboard.
      </p>

      <div class="btns">
        <a class="btn" href="{{ url_for('beneficiary_requests') }}">📌 My Requests</a>
        <a class="btn btn-primary" href="{{ url_for('beneficiary_dashboard') }}">🏠 Back to Dashboard</a>
      </div>
    </div>
  </div>

</body>
</html>
