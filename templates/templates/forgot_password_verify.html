<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - Verify</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:'Poppins', sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#eaf7ef;
      padding: 18px;
    }
    .card{
      width:min(520px,92vw);
      background:rgba(255,255,255,0.92);
      border-radius:22px;
      padding:28px 26px;
      box-shadow:0 24px 70px rgba(0,0,0,0.18);
    }
    h1{
      margin:0;
      font-size:28px;
      font-weight:800;
      color:#2e7d32;
      text-align:center;
    }
    .sub{
      margin:10px 0 18px;
      text-align:center;
      color:#6b7280;
      font-weight:600;
    }
    .input, .select{
      width:100%;
      border:1.5px solid rgba(0,0,0,0.10);
      background:#fff;
      border-radius:14px;
      padding:14px;
      font-size:15px;
      outline:none;
      margin:10px 0;
    }
    .input:focus, .select:focus{
      border-color:rgba(46,125,50,0.55);
      box-shadow:0 0 0 4px rgba(46,125,50,0.14);
    }
    .btn{
      width:100%;
      margin-top:10px;
      padding:14px;
      border:0;
      border-radius:16px;
      background:linear-gradient(180deg,#2f8a3a,#2e7d32);
      color:#fff;
      font-weight:800;
      font-size:18px;
      cursor:pointer;
    }
    .error{
      margin-top:12px;
      padding:12px;
      border-radius:12px;
      background:rgba(255,0,0,0.07);
      border:1px solid rgba(255,0,0,0.18);
      color:#b10000;
      font-weight:700;
      font-size:14px;
      text-align:center;
    }
    .info{
      margin-top:12px;
      padding:12px;
      border-radius:12px;
      background:rgba(46,125,50,0.08);
      border:1px solid rgba(46,125,50,0.18);
      color:#2e7d32;
      font-weight:700;
      font-size:14px;
      text-align:center;
    }
    .qbox{
      margin-top:12px;
      padding:12px;
      border-radius:12px;
      background:rgba(0,0,0,0.03);
      border:1px solid rgba(0,0,0,0.08);
      color:#111827;
      font-weight:800;
      font-size:14px;
      text-align:center;
    }
    .bottom{
      margin-top:14px;
      text-align:center;
      font-size:14px;
      color:#6b7280;
    }
    .bottom a{
      color:#2e7d32;
      font-weight:800;
      text-decoration:underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Forgot Password</h1>
    <div class="sub">Step 1 — Enter your email to view your security question</div>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    {% if info %}
      <div class="info">{{ info }}</div>
    {% endif %}

    <!--
      لازم يكون عندك route يستقبل POST هنا
      مثال: /forgot-password/verify?role=provider
      ويطلع لك question + email + role
    -->
    <form method="POST" action="{{ url_for('forgot_password_verify', role=role) }}" autocomplete="off">
      <select class="select" name="role" required>
        <option value="">Select Role</option>
        <option value="provider" {% if role=='provider' %}selected{% endif %}>Provider</option>
        <option value="beneficiary" {% if role=='beneficiary' %}selected{% endif %}>Beneficiary</option>
      </select>

      <input class="input"
             type="email"
             name="email"
             placeholder="Email Address"
             value="{{ email or '' }}"
             required>

      <button class="btn" type="submit">Show Question</button>
    </form>

    {% if question %}
      <div class="qbox">Security Question: {{ question }}</div>

      <!-- ينتقل للصفحة الثانية -->
      <div class="bottom" style="margin-top:12px;">
        <a href="{{ url_for('forgot_password_reset', role=role, email=email) }}">Continue to Reset</a>
      </div>
    {% endif %}

    <div class="bottom" style="margin-top:16px;">
      Back to <a href="{{ url_for('login', role=role) }}">Login</a>
    </div>
  </div>
</body>
</html>
